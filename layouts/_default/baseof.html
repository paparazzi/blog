<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ if not .IsHome }}{{ .Title }} | {{ end }}{{ site.Title }}</title><meta name="description" content="{{ if .IsPage }}{{ .Summary | plainify | truncate 160 }}{{ else }}{{ site.Params.description }}{{ end }}"><link rel="canonical" href="{{ .Permalink }}"><link rel="stylesheet" href="{{ "css/style.css" | relURL }}">{{ with .OutputFormats.Get "rss" }}<link rel="alternate" type="application/rss+xml" href="{{ .Permalink }}" title="{{ site.Title }}">{{ end }}</head>
<body><header><a class="brand" href="{{ "/" | relURL }}">PAPARAZZI <span>UAV BLOG</span></a><p>{{ site.Params.description }}</p><nav><a href="/">Latest</a><a href="/archives/">Archives</a><a href="/category/">Categories</a><a href="/about/">About</a><a href="https://github.com/paparazzi/paparazzi">GitHub ↗</a></nav></header><div class="site-layout">{{ partial "article-sidebar.html" . }}<main id="main-content">{{ block "main" . }}{{ end }}</main></div><footer>Paparazzi UAV · Open-source flight since 2003 · <a href="/feed.xml">RSS</a> · <a href="https://wiki.paparazziuav.org/">Documentation</a></footer></body></html>
